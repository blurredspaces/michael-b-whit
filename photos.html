  <script>
    const track = document.querySelector('.filmstrip__track');
    const slides = [...track.querySelectorAll('.filmstrip__slide')];
    const frames = [...document.querySelectorAll('.contact__frame')];
    const prev = document.querySelector('.filmstrip__step--prev');
    const next = document.querySelector('.filmstrip__step--next');
    let current = 0;

    function goTo(i) {
      i = Math.max(0, Math.min(slides.length - 1, i));
      track.scrollTo({ left: slides[i].offsetLeft - track.offsetLeft });
    }

    function setCurrent(i) {
      current = i;
      frames.forEach((f, n) => f.toggleAttribute('aria-current', n === i));
      frames[i].setAttribute('aria-current', 'true');
      prev.disabled = i === 0;
      next.disabled = i === slides.length - 1;
      // Keep the active frame visible in the contact sheet without moving the page
      const list = frames[i].closest('.contact__list');
      const f = frames[i].parentElement;
      if (f.offsetLeft < list.scrollLeft || f.offsetLeft + f.offsetWidth > list.scrollLeft + list.clientWidth) {
        list.scrollTo({ left: f.offsetLeft - list.clientWidth / 2 + f.offsetWidth / 2, behavior: 'smooth' });
      }
    }

    // Track which photo is centered, whether moved by swipe, trackpad, keys or buttons
    const observer = new IntersectionObserver(entries => {
      entries.forEach(e => { if (e.isIntersecting) setCurrent(slides.indexOf(e.target)); });
    }, { root: track, threshold: 0.6 });
    slides.forEach(s => observer.observe(s));

    prev.addEventListener('click', () => goTo(current - 1));
    next.addEventListener('click', () => goTo(current + 1));
    frames.forEach(f => f.addEventListener('click', () => goTo(Number(f.dataset.index))));

    track.addEventListener('keydown', e => {
      if (e.key === 'ArrowRight') { e.preventDefault(); goTo(current + 1); }
      if (e.key === 'ArrowLeft') { e.preventDefault(); goTo(current - 1); }
    });

    if (matchMedia('(prefers-reduced-motion: reduce)').matches) track.style.scrollBehavior = 'auto';
  </script>
